{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h2>Categories</h2>

    <div class="category-list">

        <a href="/">All</a>

        {% for i in category %}

            <a href="{% url 'category_products' i.id %}">
                {{ i.name }}
            </a>

        {% endfor %}

    </div>

    <hr>

    <h2>Our Products</h2>

    <div class="product-grid">

        {% for i in products %}

            <div class="product-card">

                <img src="{{ i.image.url }}" alt="{{ i.name }}">

                <h3>
                    <a href="{% url 'product_detail' i.id %}">
                        {{ i.name }}
                    </a>
                </h3>

                <p>{{ i.category }}</p>

                <p class="price">₹{{ i.price }}</p>

            </div>

        {% endfor %}

    </div>

</div>

{% endblock content %}
